global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fleet-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
