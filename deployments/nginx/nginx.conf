map $status $retry_after {
    default "";
    429 1;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;

server {
    listen 8080;
    server_name fleet.meetsin.id localhost;
    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    # Compose binds this proxy to host loopback. The host edge must replace
    # untrusted X-Forwarded-For values before forwarding through Docker.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss://fleet.meetsin.id; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Retry-After $retry_after always;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests.","requestId":"$request_id"}}';
    }

    location = /health/live {
        proxy_pass http://api:8080/health/live;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health/ready {
        proxy_pass http://api:8080/health/ready;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
