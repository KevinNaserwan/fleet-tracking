name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -d '' gofiles < <(find ./cmd ./internal ./tests -type f -name '*.go' -print0)
          ((${#gofiles[@]} > 0))
          unformatted="$(gofmt -l "${gofiles[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/...
      - run: go build ./cmd/...

  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  migrations:
    name: Migration round trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: fleet_ci
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test migrations and rerunnable seed
        env:
          TEST_DATABASE_URL: postgres://fleet:fleet-ci-password@127.0.0.1:5432/fleet_ci?sslmode=disable
        run: go test -tags=integration -count=1 ./tests/integration
      - name: Apply, roll back, and reapply migrations
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" migrate/migrate:v4.18.3 \
            -path=/migrations -database='postgres://fleet:fleet-ci-password@127.0.0.1:5432/fleet_ci?sslmode=disable' up
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" migrate/migrate:v4.18.3 \
            -path=/migrations -database='postgres://fleet:fleet-ci-password@127.0.0.1:5432/fleet_ci?sslmode=disable' down -all
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" migrate/migrate:v4.18.3 \
            -path=/migrations -database='postgres://fleet:fleet-ci-password@127.0.0.1:5432/fleet_ci?sslmode=disable' up

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./cmd/... ./internal/...
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
